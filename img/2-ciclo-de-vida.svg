<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Ciclo de vida de uma revisão: entra na fila, alguém abre e o ciclo fica preso a essa pessoa até o encerramento; o SLA corre da entrada ao encerramento." font-family="DM Sans, Helvetica, Arial, sans-serif"><rect width="1200" height="620" fill="#FAFAFA"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#827667"/></marker></defs><rect x="20" y="40" width="230" height="132" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="38" y="70" font-size="17" fill="#141414" font-weight="700" text-anchor="start">Entra na fila</text><circle cx="42" cy="92" r="2.5" fill="#827667"/><text x="52" y="96" font-size="13" fill="#333333" font-weight="400" text-anchor="start">handoff para um humano</text><circle cx="42" cy="112" r="2.5" fill="#827667"/><text x="52" y="116" font-size="13" fill="#333333" font-weight="400" text-anchor="start">pausa do membro</text><circle cx="42" cy="132" r="2.5" fill="#827667"/><text x="52" y="136" font-size="13" fill="#333333" font-weight="400" text-anchor="start">tempo de conversa</text><circle cx="42" cy="152" r="2.5" fill="#827667"/><text x="52" y="156" font-size="13" fill="#333333" font-weight="400" text-anchor="start">alerta de gravidade (P0)</text><rect x="330" y="40" width="230" height="132" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="348" y="74" font-size="19" fill="#141414" font-weight="700" text-anchor="start">Na fila</text><text x="348" y="102" font-size="14" fill="#333333" font-weight="400" text-anchor="start">ninguém abriu ainda</text><text x="348" y="124" font-size="13" fill="#6F6F6F" font-weight="400" text-anchor="start">aparece para toda a operação</text><rect x="640" y="40" width="230" height="132" rx="12" fill="#FFFFFF" stroke="#690046" stroke-width="1.4"/><text x="658" y="74" font-size="19" fill="#141414" font-weight="700" text-anchor="start">Aberto</text><text x="658" y="102" font-size="14" fill="#333333" font-weight="400" text-anchor="start">preso a quem abriu</text><text x="658" y="124" font-size="13" fill="#6F6F6F" font-weight="400" text-anchor="start">não existe botão de liberar</text><rect x="950" y="40" width="230" height="132" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="968" y="74" font-size="19" fill="#141414" font-weight="700" text-anchor="start">Encerrado</text><text x="968" y="102" font-size="14" fill="#333333" font-weight="400" text-anchor="start">avaliações gravadas</text><text x="968" y="124" font-size="13" fill="#6F6F6F" font-weight="400" text-anchor="start">sai da fila de revisão</text><line x1="254" y1="106.0" x2="326" y2="106.0" stroke="#827667" stroke-width="1.6" marker-end="url(#ah)"/><text x="290.0" y="95.0" font-size="12.5" fill="#141414" font-weight="600" text-anchor="middle">dispara</text><text x="290.0" y="128.0" font-size="11.5" fill="#6F6F6F" font-weight="400" text-anchor="middle">hora</text><text x="290.0" y="142.0" font-size="11.5" fill="#6F6F6F" font-weight="400" text-anchor="middle">de entrada</text><line x1="564" y1="106.0" x2="636" y2="106.0" stroke="#827667" stroke-width="1.6" marker-end="url(#ah)"/><text x="600.0" y="80.0" font-size="12.5" fill="#141414" font-weight="600" text-anchor="middle">alguém</text><text x="600.0" y="95.0" font-size="12.5" fill="#141414" font-weight="600" text-anchor="middle">abre</text><text x="600.0" y="128.0" font-size="11.5" fill="#6F6F6F" font-weight="400" text-anchor="middle">hora</text><text x="600.0" y="142.0" font-size="11.5" fill="#6F6F6F" font-weight="400" text-anchor="middle">de abertura</text><line x1="874" y1="106.0" x2="946" y2="106.0" stroke="#827667" stroke-width="1.6" marker-end="url(#ah)"/><text x="910.0" y="80.0" font-size="12.5" fill="#141414" font-weight="600" text-anchor="middle">Finalizar</text><text x="910.0" y="95.0" font-size="12.5" fill="#141414" font-weight="600" text-anchor="middle">revisão</text><text x="910.0" y="128.0" font-size="11.5" fill="#6F6F6F" font-weight="400" text-anchor="middle">hora do</text><text x="910.0" y="142.0" font-size="11.5" fill="#6F6F6F" font-weight="400" text-anchor="middle">encerramento</text><rect x="330" y="236" width="290" height="92" rx="12" fill="#FBF0F7" stroke="#BE0380" stroke-width="1.4"/><text x="346" y="264" font-size="15.5" fill="#BE0380" font-weight="700" text-anchor="start">Ninguém conclui</text><text x="346" y="288" font-size="13" fill="#333333" font-weight="400" text-anchor="start">fica parado com quem abriu;</text><text x="346" y="307" font-size="13" fill="#333333" font-weight="400" text-anchor="start">passou do SLA: ciclo parado</text><line x1="755.0" y1="176" x2="475.0" y2="232" stroke="#827667" stroke-width="1.3" marker-end="url(#ah)"/><text x="603.0" y="194.0" font-size="11.5" fill="#6F6F6F" font-weight="400" text-anchor="end">sai sem concluir</text><rect x="640" y="236" width="230" height="92" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="656" y="264" font-size="15.5" fill="#141414" font-weight="700" text-anchor="start">Entrar no chat</text><text x="656" y="288" font-size="13" fill="#333333" font-weight="400" text-anchor="start">handoff forçado; conta como</text><text x="656" y="307" font-size="13" fill="#333333" font-weight="400" text-anchor="start">intervenção; o ciclo segue aberto</text><line x1="755.0" y1="176" x2="755.0" y2="232" stroke="#827667" stroke-width="1.3" marker-end="url(#ah)"/><text x="765.0" y="208.0" font-size="11.5" fill="#6F6F6F" font-weight="400" text-anchor="start">intervém</text><rect x="890" y="236" width="290" height="92" rx="12" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="906" y="264" font-size="15.5" fill="#141414" font-weight="700" text-anchor="start">Redirecionar mensagens</text><text x="906" y="288" font-size="13" fill="#333333" font-weight="400" text-anchor="start">vão para a fila de outra operação;</text><text x="906" y="307" font-size="13" fill="#333333" font-weight="400" text-anchor="start">se forem todas, este ciclo fecha</text><line x1="755.0" y1="176" x2="1035.0" y2="232" stroke="#827667" stroke-width="1.3" marker-end="url(#ah)"/><text x="907.0" y="194.0" font-size="11.5" fill="#6F6F6F" font-weight="400" text-anchor="start">move mensagens</text><text x="20" y="372" font-size="17" fill="#141414" font-weight="700" text-anchor="start">O relógio do SLA</text><text x="20" y="394" font-size="13" fill="#6F6F6F" font-weight="400" text-anchor="start">vai da entrada até o encerramento; ciclo em aberto é medido até o último evento carregado</text><line x1="520" y1="412" x2="520" y2="568" stroke="#BE0380" stroke-width="1.4" stroke-dasharray="5 4"/><text x="528" y="424" font-size="12.5" fill="#BE0380" font-weight="600" text-anchor="start">limite do SLA da operação</text><rect x="60" y="438" width="320" height="28" rx="6" fill="#BE0380"/><text x="74" y="457" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="start">concluído dentro do SLA</text><circle cx="380" cy="452" r="5" fill="#FFFFFF" stroke="#BE0380" stroke-width="2"/><rect x="60" y="478" width="760" height="28" rx="6" fill="#690046"/><text x="74" y="497" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="start">concluído fora do SLA</text><circle cx="820" cy="492" r="5" fill="#FFFFFF" stroke="#690046" stroke-width="2"/><rect x="60" y="518" width="1040" height="28" rx="6" fill="#40002D"/><text x="74" y="537" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="start">em aberto e já passou do SLA: ciclo parado</text><line x1="1100" y1="532" x2="1140" y2="532" stroke="#40002D" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah)"/><line x1="60" y1="568" x2="1140" y2="568" stroke="#827667" stroke-width="1.2" marker-end="url(#ah)"/><line x1="60" y1="562" x2="60" y2="574" stroke="#827667" stroke-width="1.4"/><text x="60" y="590" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">entrada na fila</text><text x="1140" y="590" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="end">tempo</text><circle cx="740" cy="586" r="4" fill="#FFFFFF" stroke="#690046" stroke-width="2"/><text x="750" y="590" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">encerramento</text></svg>