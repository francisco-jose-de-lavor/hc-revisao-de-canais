<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 534" width="1200" height="534" role="img" aria-label="Três grãos: o canal contém ciclos de revisão, e cada ciclo contém mensagens da IA. Cada indicador da dash vive em um desses grãos." font-family="DM Sans, Helvetica, Arial, sans-serif"><rect width="1200" height="534" fill="#FAFAFA"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#827667"/></marker></defs><rect x="20" y="20" width="700" height="460" rx="18" fill="#FBF0F7" stroke="#BE0380" stroke-width="1.6"/><text x="48" y="58" font-size="15" fill="#BE0380" font-weight="700" text-anchor="start" letter-spacing="1.5">CANAL</text><text x="120" y="58" font-size="15" fill="#333333" font-weight="400" text-anchor="start">a conversa do membro com a Alice AI</text><rect x="48" y="84" width="205" height="372" rx="14" fill="#FFFFFF" stroke="#690046" stroke-width="1.2"/><text x="64" y="114" font-size="12.5" fill="#690046" font-weight="700" text-anchor="start" letter-spacing="1.2">CICLO</text><text x="64" y="138" font-size="15.5" fill="#141414" font-weight="600" text-anchor="start">Triagem</text><text x="64" y="158" font-size="13" fill="#6F6F6F" font-weight="400" text-anchor="start">1ª passagem</text><rect x="64" y="180" width="173" height="38" rx="8" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1.1"/><text x="150.5" y="203.5" font-size="13" fill="#333333" font-weight="400" text-anchor="middle">Resposta da IA 1</text><rect x="64" y="228" width="173" height="38" rx="8" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1.1"/><text x="150.5" y="251.5" font-size="13" fill="#333333" font-weight="400" text-anchor="middle">Resposta da IA 2</text><rect x="64" y="276" width="173" height="38" rx="8" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1.1"/><text x="150.5" y="299.5" font-size="13" fill="#333333" font-weight="400" text-anchor="middle">Resposta da IA 3</text><rect x="64" y="324" width="173" height="38" rx="8" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1.1"/><text x="150.5" y="347.5" font-size="13" fill="#333333" font-weight="400" text-anchor="middle">Resposta da IA 4</text><text x="64" y="412" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">entrou na fila no handoff</text><rect x="272" y="84" width="205" height="372" rx="14" fill="#FFFFFF" stroke="#690046" stroke-width="1.2"/><text x="288" y="114" font-size="12.5" fill="#690046" font-weight="700" text-anchor="start" letter-spacing="1.2">CICLO</text><text x="288" y="138" font-size="15.5" fill="#141414" font-weight="600" text-anchor="start">Triagem</text><text x="288" y="158" font-size="13" fill="#6F6F6F" font-weight="400" text-anchor="start">2ª passagem</text><rect x="288" y="180" width="173" height="38" rx="8" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1.1"/><text x="374.5" y="203.5" font-size="13" fill="#333333" font-weight="400" text-anchor="middle">Resposta da IA 1</text><rect x="288" y="228" width="173" height="38" rx="8" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1.1"/><text x="374.5" y="251.5" font-size="13" fill="#333333" font-weight="400" text-anchor="middle">Resposta da IA 2</text><text x="288" y="412" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">o membro voltou a falar</text><text x="288" y="431" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">depois do encerramento</text><rect x="496" y="84" width="205" height="372" rx="14" fill="#FFFFFF" stroke="#690046" stroke-width="1.2"/><text x="512" y="114" font-size="12.5" fill="#690046" font-weight="700" text-anchor="start" letter-spacing="1.2">CICLO</text><text x="512" y="138" font-size="15.5" fill="#141414" font-weight="600" text-anchor="start">Saúde indireta</text><text x="512" y="158" font-size="13" fill="#6F6F6F" font-weight="400" text-anchor="start">1ª passagem</text><rect x="512" y="180" width="173" height="38" rx="8" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1.1"/><text x="598.5" y="203.5" font-size="13" fill="#333333" font-weight="400" text-anchor="middle">Resposta da IA 1</text><rect x="512" y="228" width="173" height="38" rx="8" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1.1"/><text x="598.5" y="251.5" font-size="13" fill="#333333" font-weight="400" text-anchor="middle">Resposta da IA 2</text><text x="512" y="412" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">recebeu mensagens</text><text x="512" y="431" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">redirecionadas da triagem</text><rect x="770" y="20" width="410" height="140" rx="12" fill="#FFFFFF" stroke="#E2D7E0" stroke-width="1.2"/><rect x="770" y="20" width="6" height="140" rx="3" fill="#BE0380"/><text x="792" y="50" font-size="16" fill="#BE0380" font-weight="700" text-anchor="start">No canal</text><text x="792" y="72" font-size="13" fill="#6F6F6F" font-weight="400" text-anchor="start">um canal pode gerar vários ciclos</text><rect x="794" y="92" width="7" height="7" rx="1.5" fill="#BE0380"/><text x="810" y="100" font-size="13.5" fill="#333333" font-weight="400" text-anchor="start">Cobertura da Triagem</text><rect x="794" y="114" width="7" height="7" rx="1.5" fill="#BE0380"/><text x="810" y="122" font-size="13.5" fill="#333333" font-weight="400" text-anchor="start">Intervenção (uma vez por canal)</text><rect x="794" y="136" width="7" height="7" rx="1.5" fill="#BE0380"/><text x="810" y="144" font-size="13.5" fill="#333333" font-weight="400" text-anchor="start">Funil do canal à revisão</text><rect x="770" y="176" width="410" height="206" rx="12" fill="#FFFFFF" stroke="#E2D7E0" stroke-width="1.2"/><rect x="770" y="176" width="6" height="206" rx="3" fill="#690046"/><text x="792" y="206" font-size="16" fill="#690046" font-weight="700" text-anchor="start">No ciclo</text><text x="792" y="228" font-size="13" fill="#6F6F6F" font-weight="400" text-anchor="start">canal × operação × passagem pela fila</text><rect x="794" y="248" width="7" height="7" rx="1.5" fill="#690046"/><text x="810" y="256" font-size="13.5" fill="#333333" font-weight="400" text-anchor="start">Achado clínico</text><rect x="794" y="270" width="7" height="7" rx="1.5" fill="#690046"/><text x="810" y="278" font-size="13.5" fill="#333333" font-weight="400" text-anchor="start">Revisões fora do SLA</text><rect x="794" y="292" width="7" height="7" rx="1.5" fill="#690046"/><text x="810" y="300" font-size="13.5" fill="#333333" font-weight="400" text-anchor="start">Ciclos parados fora do SLA</text><rect x="794" y="314" width="7" height="7" rx="1.5" fill="#690046"/><text x="810" y="322" font-size="13.5" fill="#333333" font-weight="400" text-anchor="start">Tempo até concluir</text><rect x="794" y="336" width="7" height="7" rx="1.5" fill="#690046"/><text x="810" y="344" font-size="13.5" fill="#333333" font-weight="400" text-anchor="start">Revisões por dia e por operação</text><rect x="794" y="358" width="7" height="7" rx="1.5" fill="#690046"/><text x="810" y="366" font-size="13.5" fill="#333333" font-weight="400" text-anchor="start">Acerto de qual operação revisa</text><rect x="770" y="398" width="410" height="118" rx="12" fill="#FFFFFF" stroke="#E2D7E0" stroke-width="1.2"/><rect x="770" y="398" width="6" height="118" rx="3" fill="#40002D"/><text x="792" y="428" font-size="16" fill="#40002D" font-weight="700" text-anchor="start">Na mensagem</text><text x="792" y="450" font-size="13" fill="#6F6F6F" font-weight="400" text-anchor="start">cada resposta da IA; vale a última avaliação</text><rect x="794" y="470" width="7" height="7" rx="1.5" fill="#40002D"/><text x="810" y="478" font-size="13.5" fill="#333333" font-weight="400" text-anchor="start">Resultado da avaliação por pilar e critério</text><rect x="794" y="492" width="7" height="7" rx="1.5" fill="#40002D"/><text x="810" y="500" font-size="13.5" fill="#333333" font-weight="400" text-anchor="start">Puladas, redirecionadas e pendentes</text><circle cx="720" cy="58" r="3.5" fill="#BE0380"/><line x1="720" y1="58" x2="768" y2="50" stroke="#827667" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="701" cy="114" r="3.5" fill="#690046"/><line x1="701" y1="114" x2="768" y2="206" stroke="#827667" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="685" cy="247" r="3.5" fill="#40002D"/><line x1="685" y1="247" x2="768" y2="428" stroke="#827667" stroke-width="1.2" stroke-dasharray="4 3"/></svg>