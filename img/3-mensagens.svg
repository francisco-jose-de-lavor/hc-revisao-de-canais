<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="O que acontece com cada mensagem da IA quando o revisor encerra o ciclo: Conforme, achado, pulada, redirecionada ou pendente." font-family="DM Sans, Helvetica, Arial, sans-serif"><rect width="1200" height="630" fill="#FAFAFA"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#827667"/></marker></defs><text x="20" y="40" font-size="15" fill="#141414" font-weight="700" text-anchor="start">Mensagens da IA no ciclo</text><rect x="20" y="62" width="200" height="38" rx="8" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1.1"/><text x="120.0" y="85.5" font-size="13" fill="#333333" font-weight="400" text-anchor="middle">Resposta 1</text><rect x="20" y="108" width="200" height="38" rx="8" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1.1"/><text x="120.0" y="131.5" font-size="13" fill="#333333" font-weight="400" text-anchor="middle">Resposta 2</text><rect x="20" y="154" width="200" height="38" rx="8" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1.1"/><text x="120.0" y="177.5" font-size="13" fill="#333333" font-weight="400" text-anchor="middle">Resposta 3</text><rect x="20" y="200" width="200" height="38" rx="8" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1.1"/><text x="120.0" y="223.5" font-size="13" fill="#333333" font-weight="400" text-anchor="middle">Resposta 4</text><rect x="20" y="246" width="200" height="38" rx="8" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1.1"/><text x="120.0" y="269.5" font-size="13" fill="#333333" font-weight="400" text-anchor="middle">Resposta 5</text><path d="M228,62 L238,62 L238,292 L228,292" fill="none" stroke="#827667" stroke-width="1.3"/><circle cx="238" cy="177" r="3.5" fill="#827667"/><text x="20" y="316" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">o revisor escolhe um caminho</text><rect x="300" y="40" width="250" height="58" rx="10" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="316" y="65" font-size="15" fill="#141414" font-weight="700" text-anchor="start">Não encontrei erros</text><text x="316" y="85" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">só aparece antes de classificar</text><line x1="238" y1="177" x2="296" y2="69" stroke="#827667" stroke-width="1.2" marker-end="url(#ah)"/><line x1="554" y1="69" x2="596" y2="69" stroke="#827667" stroke-width="1.3" marker-end="url(#ah)"/><rect x="600" y="50" width="104" height="38" rx="8" fill="#E2D7E0" stroke="#E2D7E0" stroke-width="1.1"/><text x="652.0" y="73.5" font-size="12.5" fill="#40002D" font-weight="600" text-anchor="middle">Conforme</text><rect x="714" y="50" width="104" height="38" rx="8" fill="#E2D7E0" stroke="#E2D7E0" stroke-width="1.1"/><text x="766.0" y="73.5" font-size="12.5" fill="#40002D" font-weight="600" text-anchor="middle">Conforme</text><rect x="828" y="50" width="104" height="38" rx="8" fill="#E2D7E0" stroke="#E2D7E0" stroke-width="1.1"/><text x="880.0" y="73.5" font-size="12.5" fill="#40002D" font-weight="600" text-anchor="middle">Conforme</text><rect x="942" y="50" width="104" height="38" rx="8" fill="#E2D7E0" stroke="#E2D7E0" stroke-width="1.1"/><text x="994.0" y="73.5" font-size="12.5" fill="#40002D" font-weight="600" text-anchor="middle">Conforme</text><rect x="1056" y="50" width="104" height="38" rx="8" fill="#E2D7E0" stroke="#E2D7E0" stroke-width="1.1"/><text x="1108.0" y="73.5" font-size="12.5" fill="#40002D" font-weight="600" text-anchor="middle">Conforme</text><text x="600" y="112" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">todas viram Conforme: bom ou excelente</text><rect x="300" y="150" width="250" height="58" rx="10" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="316" y="175" font-size="15" fill="#141414" font-weight="700" text-anchor="start">Classifica uma mensagem</text><text x="316" y="195" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">pilar, critério e intervenção</text><line x1="238" y1="177" x2="296" y2="179" stroke="#827667" stroke-width="1.2" marker-end="url(#ah)"/><line x1="554" y1="179" x2="596" y2="179" stroke="#827667" stroke-width="1.3" marker-end="url(#ah)"/><rect x="600" y="160" width="104" height="38" rx="8" fill="#690046" stroke="#690046" stroke-width="1.1"/><text x="652.0" y="183.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">Achado</text><rect x="714" y="160" width="104" height="38" rx="8" fill="#FFFFFF" stroke="#827667" stroke-width="1.1" stroke-dasharray="4 3"/><text x="766.0" y="183.5" font-size="12.5" fill="#827667" font-weight="600" text-anchor="middle">Pulada</text><rect x="828" y="160" width="104" height="38" rx="8" fill="#FFFFFF" stroke="#827667" stroke-width="1.1" stroke-dasharray="4 3"/><text x="880.0" y="183.5" font-size="12.5" fill="#827667" font-weight="600" text-anchor="middle">Pulada</text><rect x="942" y="160" width="104" height="38" rx="8" fill="#FFFFFF" stroke="#827667" stroke-width="1.1" stroke-dasharray="4 3"/><text x="994.0" y="183.5" font-size="12.5" fill="#827667" font-weight="600" text-anchor="middle">Pulada</text><rect x="1056" y="160" width="104" height="38" rx="8" fill="#FFFFFF" stroke="#827667" stroke-width="1.1" stroke-dasharray="4 3"/><text x="1108.0" y="183.5" font-size="12.5" fill="#827667" font-weight="600" text-anchor="middle">Pulada</text><text x="600" y="222" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">o botão Não encontrei erros some; as que ninguém abriu saem como puladas</text><text x="600" y="240" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">pulada é sem avaliação registrada, e não conta como Conforme</text><rect x="300" y="260" width="250" height="58" rx="10" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="316" y="285" font-size="15" fill="#141414" font-weight="700" text-anchor="start">Redireciona mensagens</text><text x="316" y="305" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">escolhe a operação de destino</text><line x1="238" y1="177" x2="296" y2="289" stroke="#827667" stroke-width="1.2" marker-end="url(#ah)"/><line x1="554" y1="289" x2="596" y2="289" stroke="#827667" stroke-width="1.3" marker-end="url(#ah)"/><rect x="600" y="270" width="104" height="38" rx="8" fill="#CEC6B9" stroke="#CEC6B9" stroke-width="1.1"/><text x="652.0" y="293.5" font-size="12.5" fill="#40002D" font-weight="600" text-anchor="middle">Redirecionada</text><rect x="714" y="270" width="104" height="38" rx="8" fill="#CEC6B9" stroke="#CEC6B9" stroke-width="1.1"/><text x="766.0" y="293.5" font-size="12.5" fill="#40002D" font-weight="600" text-anchor="middle">Redirecionada</text><rect x="828" y="270" width="104" height="38" rx="8" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.1"/><text x="880.0" y="293.5" font-size="12.5" fill="#827667" font-weight="600" text-anchor="middle">segue aqui</text><rect x="942" y="270" width="104" height="38" rx="8" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.1"/><text x="994.0" y="293.5" font-size="12.5" fill="#827667" font-weight="600" text-anchor="middle">segue aqui</text><rect x="1056" y="270" width="104" height="38" rx="8" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.1"/><text x="1108.0" y="293.5" font-size="12.5" fill="#827667" font-weight="600" text-anchor="middle">segue aqui</text><text x="600" y="332" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">as escolhidas vão para a fila de outra operação</text><rect x="300" y="370" width="250" height="58" rx="10" fill="#FFFFFF" stroke="#CEC6B9" stroke-width="1.2"/><text x="316" y="395" font-size="15" fill="#141414" font-weight="700" text-anchor="start">Ainda não encerrou</text><text x="316" y="415" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">o ciclo está em aberto</text><line x1="238" y1="177" x2="296" y2="399" stroke="#827667" stroke-width="1.2" marker-end="url(#ah)"/><line x1="554" y1="399" x2="596" y2="399" stroke="#827667" stroke-width="1.3" marker-end="url(#ah)"/><rect x="600" y="380" width="104" height="38" rx="8" fill="#E9E2DA" stroke="#E9E2DA" stroke-width="1.1"/><text x="652.0" y="403.5" font-size="12.5" fill="#827667" font-weight="600" text-anchor="middle">Pendente</text><rect x="714" y="380" width="104" height="38" rx="8" fill="#E9E2DA" stroke="#E9E2DA" stroke-width="1.1"/><text x="766.0" y="403.5" font-size="12.5" fill="#827667" font-weight="600" text-anchor="middle">Pendente</text><rect x="828" y="380" width="104" height="38" rx="8" fill="#E9E2DA" stroke="#E9E2DA" stroke-width="1.1"/><text x="880.0" y="403.5" font-size="12.5" fill="#827667" font-weight="600" text-anchor="middle">Pendente</text><rect x="942" y="380" width="104" height="38" rx="8" fill="#E9E2DA" stroke="#E9E2DA" stroke-width="1.1"/><text x="994.0" y="403.5" font-size="12.5" fill="#827667" font-weight="600" text-anchor="middle">Pendente</text><rect x="1056" y="380" width="104" height="38" rx="8" fill="#E9E2DA" stroke="#E9E2DA" stroke-width="1.1"/><text x="1108.0" y="403.5" font-size="12.5" fill="#827667" font-weight="600" text-anchor="middle">Pendente</text><text x="600" y="442" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="start">nada foi gravado: todas pendentes</text><rect x="20" y="480" width="1160" height="132" rx="12" fill="#FFFFFF" stroke="#E2D7E0" stroke-width="1.2"/><text x="40" y="510" font-size="15" fill="#141414" font-weight="700" text-anchor="start">Os pilares do formulário</text><text x="40" y="538" font-size="12.5" fill="#6F6F6F" font-weight="600" text-anchor="start">Erro clínico</text><rect x="40" y="548" width="198" height="34" rx="8" fill="#BE0380" stroke="#BE0380" stroke-width="1.1"/><text x="139.0" y="569.5" font-size="12.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">Erro crítico clínico</text><rect x="248" y="548" width="198" height="34" rx="8" fill="#69004