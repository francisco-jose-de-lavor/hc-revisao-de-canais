<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="A carga diária vai até as 21h de Brasília; o que acontece depois só chega na carga do dia seguinte." font-family="DM Sans, Helvetica, Arial, sans-serif"><rect width="1200" height="280" fill="#FAFAFA"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#827667"/></marker></defs><rect x="27.5" y="70" width="500.0" height="56" rx="8" fill="#E2D7E0" stroke="#690046" stroke-width="1.2"/><text x="277.5" y="94" font-size="13.5" fill="#40002D" font-weight="700" text-anchor="middle">chega na carga da manhã de D+1</text><text x="277.5" y="113" font-size="12.5" fill="#333333" font-weight="400" text-anchor="middle">das 21h de D-1 às 21h de D</text><rect x="527.5" y="70" width="500.0" height="56" rx="8" fill="#F3F2F0" stroke="#CEC6B9" stroke-width="1.2" stroke-dasharray="5 4"/><text x="777.5" y="94" font-size="13.5" fill="#827667" font-weight="700" text-anchor="middle">chega na carga da manhã de D+2</text><text x="777.5" y="113" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="middle">das 21h de D às 21h de D+1</text><rect x="527.5" y="134" width="62.5" height="10" rx="3" fill="#BE0380"/><line x1="558.75" y1="148" x2="598.75" y2="178" stroke="#BE0380" stroke-width="1.2"/><text x="602.75" y="182" font-size="12.5" fill="#BE0380" font-weight="600" text-anchor="start">o fim da noite de D só aparece um dia depois</text><line x1="30" y1="232" x2="1170" y2="232" stroke="#827667" stroke-width="1.2" marker-end="url(#ah)"/><line x1="90.0" y1="226" x2="90.0" y2="238" stroke="#827667" stroke-width="1.3"/><text x="90.0" y="256" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="middle">D 0h</text><line x1="527.5" y1="226" x2="527.5" y2="238" stroke="#827667" stroke-width="1.3"/><text x="527.5" y="256" font-size="12.5" fill="#6F6F6F" font-weight="600" text-anchor="middle">D 21h</text><line x1="527.5" y1="62" x2="527.5" y2="224" stroke="#CEC6B9" stroke-width="1" stroke-dasharray="3 3"/><line x1="590.0" y1="226" x2="590.0" y2="238" stroke="#827667" stroke-width="1.3"/><text x="590.0" y="256" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="middle">D+1 0h</text><line x1="1027.5" y1="226" x2="1027.5" y2="238" stroke="#827667" stroke-width="1.3"/><text x="1027.5" y="256" font-size="12.5" fill="#6F6F6F" font-weight="600" text-anchor="middle">D+1 21h</text><line x1="1027.5" y1="62" x2="1027.5" y2="224" stroke="#CEC6B9" stroke-width="1" stroke-dasharray="3 3"/><line x1="1090.0" y1="226" x2="1090.0" y2="238" stroke="#827667" stroke-width="1.3"/><text x="1090.0" y="256" font-size="12.5" fill="#6F6F6F" font-weight="400" text-anchor="middle">D+2 0h</text><text x="30" y="40" font-size="13" fill="#6F6F6F" font-weight="400" text-anchor="start">horário de Brasília; a tabela é carregada uma vez por dia, por dia UTC</text></svg>